<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FileVault Pro - Signup</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body class="auth-page">

<div class="auth-shell">
    <div class="auth-brand">
        <div class="brand-mark">☁</div>
        <h1>FileVault <span>Pro</span></h1>
        <p>Create your personal cloud storage account.</p>
        <div class="auth-art">＋</div>
        <small>Simple storage. Smarter collaboration.</small>
    </div>

    <div class="auth-card">
        <p class="eyebrow">GET STARTED</p>
        <h2>Create your account</h2>
        <p class="muted">Register to access your workspace.</p>

        <form id="signupForm">
            <label>Full Name</label>
            <input type="text" id="signupName"
                   placeholder="Enter your name" required>

            <label>Email Address</label>
            <input type="email" id="signupEmail"
                   placeholder="Enter your email" required>

            <label>Password</label>
            <div class="password-wrap">
                <input type="password" id="signupPassword"
                       placeholder="Minimum 6 characters" required>
                <button type="button" class="show-pass"
                        data-target="signupPassword">Show</button>
            </div>

            <label>Confirm Password</label>
            <input type="password" id="confirmPassword"
                   placeholder="Re-enter password" required>

            <p id="signupMessage" class="form-message"></p>

            <button type="submit" class="primary-btn full">
                Create Account
            </button>
        </form>

        <p class="auth-switch">
            Already registered?
            <a href="./login.html">Sign In</a>
        </p>
    </div>
</div>

<script src="./auth.js"></script>
</body>
</html>
