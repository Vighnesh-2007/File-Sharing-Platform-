<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FileVault Pro - Login</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body class="auth-page">

<div class="auth-shell">
    <div class="auth-brand">
        <div class="brand-mark">☁</div>
        <h1>FileVault <span>Pro</span></h1>
        <p>Store, organize and securely share your files.</p>
        <div class="auth-art">⇧</div>
        <small>Your files, all in one place.</small>
    </div>

    <div class="auth-card">
        <p class="eyebrow">WELCOME BACK</p>
        <h2>Sign in to your account</h2>
        <p class="muted">Access your personal workspace.</p>

        <form id="loginForm">
            <label>Email address</label>
            <input type="email" id="loginEmail"
                   placeholder="Enter your email" required>

            <label>Password</label>
            <div class="password-wrap">
                <input type="password" id="loginPassword"
                       placeholder="Enter password" required>
                <button type="button" class="show-pass"
                        data-target="loginPassword">Show</button>
            </div>

            <p id="loginMessage" class="form-message"></p>

            <button type="submit" class="primary-btn full">
                Sign In
            </button>
        </form>

        <p class="auth-switch">
            Don't have an account?
            <a href="./signup.html">Create Account</a>
        </p>
    </div>
</div>

<script src="./auth.js"></script>
</body>
</html>
